<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>음악 추가 실행</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; margin: 0; background: #f8f9fa; }
.card { background: white; padding: 28px 20px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); text-align: center; max-width: 320px; width: 85%; }
h2 { font-size: 20px; margin: 0 0 8px; color: #111; }
p { font-size: 14px; color: #666; margin: 0 0 20px; line-height: 1.4; }
.btn { display: inline-block; padding: 14px 28px; background: #007aff; color: white; border-radius: 30px; text-decoration: none; font-weight: 600; font-size: 16px; box-shadow: 0 2px 8px rgba(0,122,255,0.3); }
</style>
</head>
<body>
<div class="card">
  <h2>🎵 음악추가 실행</h2>
  <p>단축어로 곡 목록을 전달합니다...</p>
  <a id="btn" class="btn" href="#">단축어 열기</a>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const text = params.get('t') || params.get('text') || '';
const target = 'shortcuts://run-shortcut?name=' + encodeURIComponent('음악추가') + '&input=text&text=' + encodeURIComponent(text);
document.getElementById('btn').href = target;
// Auto redirect
setTimeout(function() {
  window.location.href = target;
}, 300);
</script>
</body>
</html>
